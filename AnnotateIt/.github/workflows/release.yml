name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to match your project SDK version

    - name: Publish Standalone Executable
      run: >
        dotnet publish AnnotateIt/AnnotateIt.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o ./publish

    - name: Rename Executable for Release
      shell: pwsh
      run: |
        Move-Item -Path ./publish/AnnotateIt.exe -Destination ./publish/AnnotateIt-win-x64.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/AnnotateIt-win-x64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
